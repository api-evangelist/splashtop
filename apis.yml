name: Splashtop
description: >-
  Splashtop is a secure remote access, remote support, and endpoint management
  company founded in 2006 by four MIT-educated engineers (Mark Lee, Robert Ha,
  Thomas Deng, and Philip Sheu). Its platform lets individuals, IT teams, and
  managed service providers connect to computers and devices from anywhere with
  high-performance streaming (up to 4K at 60fps) and strong security. The product
  suite spans Remote Access for individuals and teams, Remote Support for IT and
  MSPs, Autonomous Endpoint Management with real-time patch deployment, and
  Enterprise offerings with SSO, alongside security products including antivirus,
  endpoint detection and response, and Foxpass Wi-Fi/access controls. Splashtop
  serves 30+ million users across 800+ million sessions, reached unicorn status
  in 2021, and is ISO/IEC 27001:2022, SOC 2 Type 2, CSA STAR, GDPR, HIPAA, and
  PCI compliant. It documents a REST API for business/MSP integrations and
  publishes a live service status page.
